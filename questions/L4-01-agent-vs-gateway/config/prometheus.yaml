global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: collector
    static_configs:
      - targets:
          - collector:8888

  - job_name: gateway
    static_configs:
      - targets:
          - gateway:8888

  - job_name: sink
    static_configs:
      - targets:
          - sink:8888
