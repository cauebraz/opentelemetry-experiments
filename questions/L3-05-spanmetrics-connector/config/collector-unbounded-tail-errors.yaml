receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  tail_sampling:
    decision_wait: 5s
    num_traces: 5000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes:
            - ERROR
  batch: {}

connectors:
  spanmetrics:
    namespace: l3_05
    metrics_flush_interval: 1s
    histogram:
      unit: ms
      explicit:
        buckets:
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
    dimensions:
      - name: http.route
      - name: customer.id

exporters:
  otlp_grpc/sink:
    endpoint: sink:4317
    timeout: 5s
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    metric_expiration: 5m
    translation_strategy: UnderscoreEscapingWithSuffixes

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - tail_sampling
        - batch
      exporters:
        - otlp_grpc/sink
        - spanmetrics
    metrics:
      receivers:
        - spanmetrics
      exporters:
        - prometheus
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
