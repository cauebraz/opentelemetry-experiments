receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.start_time_unix_nano, 1700000000000000000)
          - set(datapoint.time_unix_nano, 1700000001000000000)
      - context: metric
        statements:
          - aggregate_on_attributes("sum", ["environment", "region", "http.method", "http.status_code"])
  batch: {}

connectors:
  forward:
  count:
    datapoints:
      l4_02.inbound:
        description: Data points by user.id as the Collector received them.
        attributes:
          - key: user.id
            default_value: none

exporters:
  otlp_grpc/sink:
    endpoint: sink:4317
    timeout: 5s
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    metric_expiration: 5m
    translation_strategy: UnderscoreEscapingWithSuffixes

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  pipelines:
    metrics/in:
      receivers:
        - otlp
      exporters:
        - forward
        - count
    metrics/process:
      receivers:
        - forward
      processors:
        - transform
        - batch
      exporters:
        - prometheus
        - otlp_grpc/sink
    metrics/counts:
      receivers:
        - count
      exporters:
        - prometheus
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
